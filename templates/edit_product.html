<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/admin/dashboard">

            Mobile Store Admin

        </a>

        <a href="/admin/products"
           class="btn btn-outline-light btn-sm">

            Manage Products

        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4 p-md-5">

                    <h2 class="mb-4">
                        Edit Product
                    </h2>


                    <form method="POST"
                          enctype="multipart/form-data">


                        <!-- Product Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                   name="product_name"
                                   class="form-control"
                                   value="{{ product['product_name'] }}"
                                   required>

                        </div>


                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select name="category"
                                    class="form-select"
                                    required>

                                <option value="Chargers"
                                    {% if product['category'] == 'Chargers' %}selected{% endif %}>
                                    Chargers
                                </option>

                                <option value="Earphones"
                                    {% if product['category'] == 'Earphones' %}selected{% endif %}>
                                    Earphones
                                </option>

                                <option value="Power Banks"
                                    {% if product['category'] == 'Power Banks' %}selected{% endif %}>
                                    Power Banks
                                </option>

                                <option value="Smart Watches"
                                    {% if product['category'] == 'Smart Watches' %}selected{% endif %}>
                                    Smart Watches
                                </option>

                                <option value="Mobile Covers"
                                    {% if product['category'] == 'Mobile Covers' %}selected{% endif %}>
                                    Mobile Covers
                                </option>

                                <option value="Screen Protectors"
                                    {% if product['category'] == 'Screen Protectors' %}selected{% endif %}>
                                    Screen Protectors
                                </option>

                                <option value="Other Accessories"
                                    {% if product['category'] == 'Other Accessories' %}selected{% endif %}>
                                    Other Accessories
                                </option>

                            </select>

                        </div>


                        <div class="row">

                            <!-- Price -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Price (₹)
                                </label>

                                <input type="number"
                                       name="price"
                                       class="form-control"
                                       value="{{ product['price'] }}"
                                       min="0"
                                       step="0.01"
                                       required>

                            </div>


                            <!-- Stock -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stock Quantity
                                </label>

                                <input type="number"
                                       name="stock"
                                       class="form-control"
                                       value="{{ product['stock'] }}"
                                       min="0"
                                       required>

                            </div>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label">
                                Product Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      rows="5">{{ product['description'] }}</textarea>

                        </div>


                        <!-- Current Image -->

                        {% if product['image'] %}

                        <div class="mb-3">

                            <label class="form-label">
                                Current Image
                            </label>

                            <br>

                            <img
                                src="{{ url_for('static', filename='uploads/' + product['image']) }}"
                                width="150"
                                class="rounded mb-2">

                        </div>

                        {% endif %}


                        <!-- New Image -->

                        <div class="mb-4">

                            <label class="form-label">
                                Change Product Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control"
                                   accept="image/*">

                            <small class="text-muted">
                                Leave empty if you don't want to change the image.
                            </small>

                        </div>


                        <!-- Buttons -->

                        <button type="submit"
                                class="btn btn-primary">

                            Update Product

                        </button>

                        <a href="/admin/products"
                           class="btn btn-secondary">

                            Cancel

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
