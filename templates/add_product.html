<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/admin/dashboard">
            Mobile Store Admin
        </a>

        <div>
            <a href="/admin/products" class="btn btn-outline-light btn-sm">
                Manage Products
            </a>

            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>
        </div>

    </div>

</nav>


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-body p-4 p-md-5">

                    <h2 class="mb-4">
                        Add New Product
                    </h2>

                    <form method="POST" enctype="multipart/form-data">

                        <!-- Product Name -->

                        <div class="mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input type="text"
                                   name="product_name"
                                   class="form-control"
                                   placeholder="Enter product name"
                                   required>

                        </div>


                        <!-- Category -->

                        <div class="mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <select name="category"
                                    class="form-select"
                                    required>

                                <option value="" selected disabled>
                                    Select Category
                                </option>

                                <option value="Chargers">
                                    Chargers
                                </option>

                                <option value="Earphones">
                                    Earphones
                                </option>

                                <option value="Power Banks">
                                    Power Banks
                                </option>

                                <option value="Smart Watches">
                                    Smart Watches
                                </option>

                                <option value="Mobile Covers">
                                    Mobile Covers
                                </option>

                                <option value="Screen Protectors">
                                    Screen Protectors
                                </option>

                                <option value="Other Accessories">
                                    Other Accessories
                                </option>

                            </select>

                        </div>


                        <div class="row">

                            <!-- Price -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Price (₹)
                                </label>

                                <input type="number"
                                       name="price"
                                       class="form-control"
                                       placeholder="Enter price"
                                       min="0"
                                       step="0.01"
                                       required>

                            </div>


                            <!-- Stock -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Stock Quantity
                                </label>

                                <input type="number"
                                       name="stock"
                                       class="form-control"
                                       placeholder="Enter stock quantity"
                                       min="0"
                                       required>

                            </div>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label">
                                Product Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Write product description"></textarea>

                        </div>


                        <!-- Product Image -->

                        <div class="mb-4">

                            <label class="form-label">
                                Product Image
                            </label>

                            <input type="file"
                                   name="image"
                                   class="form-control"
                                   accept="image/*">

                            <small class="text-muted">
                                Image upload will be connected in the next step.
                            </small>

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-success">
                                Save Product
                            </button>

                            <a href="/admin/products"
                               class="btn btn-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
