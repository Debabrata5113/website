<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Dashboard - Mobile Store</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            Mobile Store
        </a>

        <a
            href="/products"
            class="btn btn-outline-light btn-sm"
        >
            Continue Shopping
        </a>

    </div>

</nav>



<!-- DASHBOARD -->

<div class="container py-5">


    <!-- Welcome -->

    <div class="mb-4">

        <h2>
            My Dashboard
        </h2>

        <p class="text-muted">

            Welcome,
            <strong>{{ user_name }}</strong>

        </p>

        <p class="text-muted">
            {{ user_email }}
        </p>

    </div>



    <!-- Dashboard Cards -->

    <div class="row">


        <!-- My Orders -->

        <div class="col-md-3 col-sm-6 mb-4">

            <div class="card text-center shadow h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        My Orders
                    </h5>

                    <p class="text-muted">
                        View your orders
                    </p>

                    <a
                        href="/my-orders"
                        class="btn btn-primary"
                    >
                        View
                    </a>

                </div>

            </div>

        </div>



        <!-- Wishlist -->

        <div class="col-md-3 col-sm-6 mb-4">

            <div class="card text-center shadow h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Wishlist
                    </h5>

                    <p class="text-muted">
                        Your saved products
                    </p>

                    <a
                        href="/wishlist"
                        class="btn btn-success"
                    >
                        View
                    </a>

                </div>

            </div>

        </div>



        <!-- Profile -->

        <div class="col-md-3 col-sm-6 mb-4">

            <div class="card text-center shadow h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Profile
                    </h5>

                    <p class="text-muted">
                        Manage your account
                    </p>

                    <button
                        class="btn btn-warning"
                        disabled
                    >
                        Edit
                    </button>

                </div>

            </div>

        </div>



        <!-- Logout -->

        <div class="col-md-3 col-sm-6 mb-4">

            <div class="card text-center shadow h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Logout
                    </h5>

                    <p class="text-muted">
                        Sign out of your account
                    </p>

                    <a
                        href="{{ url_for('logout') }}"
                        class="btn btn-danger"
                    >
                        Logout
                    </a>

                </div>

            </div>

        </div>


    </div>


</div>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
